name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Composed app type-checks against the kit
        run: npm run check:composed
      # The codebase still has known lint errors; report them without blocking merges.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q

  vercel-entrypoint:
    # The serverless function installs only the root requirements.txt. Importing the
    # entrypoint with exactly those packages catches a missing dependency before deploy.
    name: Vercel entrypoint imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import index"
        working-directory: api
